# SPDX-License-Identifier: MIT
# Omandroid build configuration. Override any value in omandroid.local.conf (gitignored).

# LineageOS branch we build on
BRANCH=lineage-24.0

# Device codename (cheetah = Pixel 7 Pro)
DEVICE=cheetah

# Build variant: userdebug for development, user for releases
VARIANT=userdebug

# Where the ~400 GB source tree lives (outside this repo)
SRC_DIR="$HOME/android/omandroid"

# ccache location and size
CCACHE_DIR="$HOME/.cache/omandroid-ccache"
CCACHE_SIZE=50G

# Parallel build jobs. Lower this if the build runs out of memory.
JOBS=10

# Docker image for the build environment
IMAGE=omandroid-build:24.04
