# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 7 Pro (cheetah).
#
# Everything bin/omandroid (and, later, the device package and the release
# tooling) needs to know about one phone, in one place. docs/RELEASES.md
# describes each key. Format: KEY=value or KEY="value" lines, comments and
# blank lines only. No shell: no $, backticks or command substitution, so
# other tools (Python, the pacman hook, the initramfs) can read it as data.
# bin/omandroid refuses a descriptor that breaks these rules.

# --- Identity ---
CODENAME=cheetah
NAME="Pixel 7 Pro"
SOC=gs201
# First string of the DT root compatible; brcmfmac and btbcm look up
# board-specific firmware by it (tools/extract-vendor-firmware).
COMPATIBLE="google,gs201-cheetah"
# The Omandroid package that carries this device's userspace support.
PACKAGE=omandroid-device-cheetah

# --- Kernel and device tree ---
# The board DTB, relative to arch/arm64/boot/dts in the kernel build.
DTB=exynos/google/gs201-cheetah.dtb
# ABL picks the base DTB by /soc_id. The DTB is built with the first value;
# bin/omandroid images ships one copy per value, labelled for its file name
# (<codename>-<label>.dtb), in this order inside dtb.img. Lower-case hex,
# as dtc prints it.
SOC_IDS="b0:0x9855001 a0:0x9855000"

# --- Bootloader glue ---
# The board dtbo ABL applies on top of the base DTB, matched by board_id and
# board_rev (stock: getprop ro.boot.dtbo_idx and the stock dtbo.img). The
# source sits beside this file and must carry the same two values.
DTBO_SOURCE=cheetah-m1-overlay.dts
DTBO_BOARD_ID=0x30306
DTBO_BOARD_REV=0x10000
# vendor_boot command line. ABL ignores it for kernel arguments (those go in
# the DTB's /chosen/bootargs); earlycon's address is the SoC's UART.
VENDOR_CMDLINE="console=tty0 earlycon=exynos4210,0x10A00000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
# Page size of the vendor_boot images, and the init_boot header's OS
# version and patch level.
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-07

# --- Storage guard ---
# The boot images Omandroid writes, always to slot B (the _b suffix is added
# by the tools, never configured), and the GPT names the initramfs guard
# leaves writable. Must match UFS_RW in the initramfs init; bin/omandroid
# checks that it does. Only slot B partitions and userdata may appear here.
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
# The init script, relative to this directory. It still carries cheetah's
# quirks (the DECON TRIG_CON write, the USB product string); see RELEASES.md.
INITRAMFS_INIT=initramfs/init
# Panel size in pixels, portrait, for the early boot splash.
PANEL_SIZE=1440x3120
