# Omandroid: keep Panthor (Mali-G710) from loading at boot during GPU
# bring-up. The gs201 device tree now has a GPU node, so udev would load
# panthor through its modalias; if G3D is not powered or clocked the first
# register read takes the phone down. Load it by hand over SSH instead
# (`modprobe panthor`); an explicit modprobe ignores this blacklist.
# Remove this file once gate G1 in device/cheetah/GPU-PLAN.md passes.
blacklist panthor
