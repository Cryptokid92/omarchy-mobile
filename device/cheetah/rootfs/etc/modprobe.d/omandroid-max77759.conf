# MAX77759 bring-up: load these by hand (device/cheetah/WIFI-BATTERY-PLAN.md).
# max77759_charger turns charging off at probe until a Type-C source is
# reported, and tcpci_maxim would take over the USB-C port we use for SSH.
blacklist max77759
blacklist max77759_charger
blacklist tcpci_maxim
blacklist max17042_battery
blacklist gpio_max77759
blacklist nvmem_max77759
