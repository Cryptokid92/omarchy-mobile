# Omarchy Mobile build configuration. Override any value in omamobile.local.conf (gitignored).

# LineageOS branch we build on
BRANCH=lineage-24.0

# Device codename (cheetah = Pixel 7 Pro): picks device/<codename>/device.conf
# for bin/omamobile and the LineageOS target for bin/lineage-ref. Override
# per command with DEVICE=<codename> in the environment.
DEVICE="${DEVICE:-cheetah}"

# Build variant: userdebug for development, user for releases
VARIANT=userdebug

# Where the ~400 GB source tree lives (outside this repo)
SRC_DIR="$HOME/android/omamobile"

# ccache location and size
CCACHE_DIR="$HOME/.cache/omamobile-ccache"
CCACHE_SIZE=50G

# Parallel build jobs. Lower this if the build runs out of memory.
JOBS=10

# Docker image for the build environment
IMAGE=omamobile-build:24.04
