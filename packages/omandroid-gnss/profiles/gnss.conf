# SPDX-License-Identifier: MIT
# Vendor-chroot profile "gnss": Broadcom's lhd (patch loader and chip link)
# and gpsd (the position engine) from the stock vendor image, driving the
# BCM4775x through the bcm4775x-gnss kernel driver (/dev/ttyBCM, /dev/bbd_*).
# device/cheetah/GNSS-PLAN.md.
#
# Output: NMEA on the FIFO /data/vendor/gps/nmea_out (gps.xml NmeaOutName),
# that is $STATE/data/vendor/gps/nmea_out on the host, which
# omandroid-gnss-nmea serves to GeoClue and gpsd.
# shellcheck shell=bash disable=SC2034

STATE=/var/lib/omandroid-vendor/gnss
# gpsd links libbinder_ndk (sensor fusion, wake locks): a private binderfs
# and servicemanager, with the sensor and suspend services reported absent
# by the shim at once.
BINDER=yes
NO_SERVICES="android.hardware.sensors.,android.hardware.gnss.,vendor.samsung_slsi.telephony."

GNSS_NODES=(ttyBCM bbd_control bbd_patch bbd_pwrstat bbd_sensor)
BINS=(/vendor/bin/hw/lhd /vendor/bin/hw/gpsd)
# gpsd's four SIT RIL calls (modem-assisted GNSS) succeed as no-ops: with no
# RIL the real GpsOpen() fails and gpsd aborts (G3b).
PRELOADS=(libomandroid-sitril-gps.so)
# gpsd retries its (absent) sensor service from a new thread after every
# failed lookup, in a tight loop; park those threads (see the shim).
ABSENT_PARK=1
# The user's settings, /etc/omandroid/gnss.conf (GNSS_CONF_*): assistance,
# time and position injection, SUPL. See that file.
# shellcheck source=../lib/omandroid-gnss-conf
source "$LIB/omandroid-gnss-conf"

# Servers gpsd itself talks to. bionic can't reach DNS here; the runner
# resolves these on the host and writes them into the chroot's hosts file.
# - gllto.glpals.com: real-time orbits and satellite health, which gpsd
#   fetches over HTTP itself (gps.xml RtoEnable/RtiEnable; gpsd's built-in
#   addresses gllto.glpals.com:80/rto.dat and /rtistatus5.dat).
# - The SUPL server, only with SUPL=1.
# The long-term orbit file (gllto2.glpals.com/4day/v5/latest/lto2.dat) is
# downloaded on the host instead (omandroid-gnss-lto): stock gpsd asks the
# Android framework for it (HttpSyncLto), and gpsd's own direct download
# (HttpDirectSyncLto) stays off as on stock.
HOSTS=()
if [[ $GNSS_CONF_ASSISTANCE == 1 ]]; then HOSTS+=(gllto.glpals.com); fi
if [[ $GNSS_CONF_SUPL == 1 ]]; then HOSTS+=("${GNSS_CONF_SUPL_SERVER%:*}"); fi

# OMANDROID_GNSS_STAGE: "lhd" starts only lhd; "gpsd" (default) starts the
# engine too. lhd starts the chip on its own at start-up: nstandby 0 then 1
# (sysfs), 20 ms, then it opens /dev/bbd_control and /dev/ttyBCM, auto-bauds
# and downloads the patch (its verbose log, under qemu). gpsd connects to it
# over the named pipes in /data/vendor/gps.
# OMANDROID_GNSS_REQ: gpsd starts a position session only when asked. With
# "1" (default) the runner asks through gpsd's control pipe (gps.xml CtrlPipe,
# /data/vendor/gps/glgpsctrl) for a continuous request, whose NMEA goes to
# the NmeaOutName FIFO: "$pglirm,req_pos,omandroid,period,1000" (the
# command and its stop counterpart are strings in gpsd). "0" leaves gpsd
# idle.
# OMANDROID_GNSS_JOB: name a <job> from gps.xml on gpsd's command line
# instead ("omandroid" is a continuous request added below). Empty
# (default): gpsd runs as a plain daemon.
GNSS_STAGE=${OMANDROID_GNSS_STAGE:-gpsd}
GNSS_REQ=${OMANDROID_GNSS_REQ:-1}
GNSS_JOB=${OMANDROID_GNSS_JOB:-}
GNSS_CTRL=$STATE/data/vendor/gps/glgpsctrl
# OMANDROID_GNSS_LHD_LOG: lhd's LogLevel (tag:level, as in its own
# "SetLogLevel: [*:E]"). Bring-up default: everything ("*:V"). Empty keeps
# stock's (errors only).
GNSS_LHD_LOG=${OMANDROID_GNSS_LHD_LOG-*:V}
# OMANDROID_GNSS_GPSD_LOG: 1 (bring-up default) turns gpsd's own log on and
# sends it to logcat (our stderr): its config, assistance (LTO, SUPL),
# engine and session messages. Stock: off.
GNSS_GPSD_LOG=${OMANDROID_GNSS_GPSD_LOG:-1}
# OMANDROID_GNSS_NMEA411: 1 sets EnableNmeaV411 in gps.xml's <gll>, which
# gpsd knows by name; stock leaves it unset. Experimental (G4b).
GNSS_NMEA411=${OMANDROID_GNSS_NMEA411:-0}

gnss_nstandby() {
  local d
  for d in /sys/bus/spi/drivers/bcm4775x-gnss/spi*; do
    [[ -f $d/nstandby ]] && { echo "$d/nstandby"; return; }
  done
}

profile_check() {
  local ok=0 n
  for n in "${GNSS_NODES[@]}"; do
    [[ -c /dev/$n ]] || { say "no /dev/$n (modprobe bcm4775x-gnss, gnss DT overlay)"; ok=1; }
  done
  [[ -n $(gnss_nstandby) ]] || { say "no nstandby attribute (bcm4775x-gnss not bound)"; ok=1; }
  [[ -f $IMAGE/vendor/bin/hw/lhd && -f $IMAGE/vendor/bin/hw/gpsd ]] ||
    { say "no lhd/gpsd in $IMAGE"; ok=1; }
  [[ -f $IMAGE/vendor/firmware/SensorHub.patch ]] || { say "no SensorHub.patch in $IMAGE"; ok=1; }
  return $ok
}

# Stock's configuration with these changes: the nstandby attribute's path in
# the chroot, logs under /data, no PPS (Google's bbd_pps is not ported), and
# no sensor aiding (SensorsMask 0): there is no Android sensor service, and
# with the mask set gpsd retries it in a tight loop (tens of thousands of
# times a minute). And from the user's settings:
# - constellations: GLONASS, Galileo and BeiDou are named in <gll_features>
#   (where gpsd's parser takes them; <hal> asserts on EnableGlonass). This
#   is what the engine does anyway: unset, all three default to on, and
#   stock adds NavIC (EnableNavic) and keeps QZSS always on
#   (EnableQzsAutoSwitch=false). L1+L5/E5a dual frequency is stock's
#   (<gll> MultiCarrRFMode L1_L5, both external LNAs on). GNSS-PLAN.md 7.1.
# - SUPL=0 (default): SuplEnable false. SUPL=1: the configured server.
# - ASSISTANCE=0: no RTO/RTI downloads and no LTO sync requests.
gnss_config() {
  local out=$1 supl_host=${GNSS_CONF_SUPL_SERVER%:*} supl_port=${GNSS_CONF_SUPL_SERVER##*:}
  mkdir -p "$out"
  sed -e 's|^GpioNStdbyPath=.*|GpioNStdbyPath=/sys/omandroid-gnss/nstandby|' \
      -e 's|^LogDirectory=.*|LogDirectory=/data/vendor/gps/log|' \
      -e 's|^PpsEnable=.*|PpsEnable=false|' \
      "$IMAGE/vendor/etc/gnss/lhd.conf" > "$out/lhd.conf"
  if [[ -n $GNSS_LHD_LOG ]]; then
    # With LogEnabled=false lhd drops back to errors after reading its
    # config; logging to logcat (our stderr, through the shim) keeps it.
    sed -i -e '/^LogLevel=/d' -e 's/^LogEnabled=.*/LogEnabled=true/' \
        -e 's/^Log=.*/Log=LOGCAT/' "$out/lhd.conf"
    printf 'LogLevel=%s\n' "$GNSS_LHD_LOG" >> "$out/lhd.conf"
  fi
  sed -e 's|GpioNStdbyPath="[^"]*"|GpioNStdbyPath="/sys/omandroid-gnss/nstandby"|' \
      -e 's|LogDirectory="[^"]*"|LogDirectory="/data/vendor/gps/log/"|' \
      -e 's|PpsEnable="true"|PpsEnable="false"|' \
      -e 's|SensorsMask="[^"]*"|SensorsMask="0x0"|' \
      -e "$( ((GNSS_GPSD_LOG)) && echo 's|LogEnabled=\"false\"|LogEnabled=\"true\"|; s|Log=\"JAVA\"|Log=\"LOGCAT\"|' || echo 's|^@@never@@$||')" \
      -e "$( ((GNSS_NMEA411)) && echo 's|^  <gll$|  <gll\n       EnableNmeaV411=\"true\"|' || echo 's|^@@never@@$||')" \
      -e 's|^  <gll_features$|  <gll_features\n       EnableGlonass="true"\n       EnableGalileo="true"\n       EnableBeidou="true"|' \
      -e "$( ((GNSS_CONF_SUPL)) && echo "s|acSuplServer=\"[^\"]*\"|acSuplServer=\"$supl_host\"|; s|SuplPort=\"[^\"]*\"|SuplPort=\"$supl_port\"|" || echo 's|SuplEnable="true"|SuplEnable="false"|')" \
      -e "$( ((GNSS_CONF_ASSISTANCE)) && echo 's|^@@never@@$||' || echo 's|RtoEnable="true"|RtoEnable="false"|; s|RtiEnable="true"|RtiEnable="false"|; s|HttpSyncLto="true"|HttpSyncLto="false"|')" \
      -e 's|</glgps>|  <job id="omandroid">\n    <task>\n      <req_pos validfix="4294967295" duration_sec="4294967295"/>\n    </task>\n  </job>\n</glgps>|' \
      "$IMAGE/vendor/etc/gnss/gps.xml" > "$out/gps.xml"
  grep -q '<job id="omandroid">' "$out/gps.xml" || die "gps.xml: job not added"
  grep -q 'EnableGlonass="true"' "$out/gps.xml" || die "gps.xml: no <gll_features> line to extend"
  if ((GNSS_CONF_SUPL)); then
    grep -q "acSuplServer=\"$supl_host\"" "$out/gps.xml" || die "gps.xml: SUPL server not set"
  else
    # privacy: never start with SUPL on when the user has it off
    grep -q 'SuplEnable="false"' "$out/gps.xml" || die "gps.xml: SUPL not switched off"
  fi
  grep -q 'GpioNStdbyPath=/sys/omandroid-gnss/nstandby' "$out/lhd.conf" ||
    die "lhd.conf: GpioNStdbyPath not rewritten"
  grep -q 'GpioNStdbyPath="/sys/omandroid-gnss/nstandby"' "$out/gps.xml" ||
    die "gps.xml: GpioNStdbyPath not rewritten"
}

# Long-term orbits: fetched on the host (bionic has no DNS here) by the
# same script as omandroid-gnss-lto.timer, before gpsd reads the file. Quick
# and non-fatal: no network means a start without fresh predictions.
gnss_lto() {
  "$LIB/omandroid-gnss-lto" --timeout 20 --quiet-offline 2>&1 | sed -u 's/^/omandroid-vendor[gnss]: /' >&2 || true
}

profile_setup() {
  local n gps=$STATE/data/vendor/gps
  for n in "${GNSS_NODES[@]}"; do bind "/dev/$n" "$ROOT/dev/$n"; done
  bind "$(gnss_nstandby)" "$ROOT/sys/omandroid-gnss/nstandby"
  mkdir -p "$gps/log"
  [[ -p $gps/nmea_out ]] || { rm -f "$gps/nmea_out"; mkfifo -m 0600 "$gps/nmea_out"; }
  # gpsd's control pipe (gps.xml CtrlPipe): created here, so the request
  # below never depends on whether gpsd makes it itself
  [[ -p $gps/glgpsctrl ]] || { rm -f "$gps/glgpsctrl"; mkfifo -m 0660 "$gps/glgpsctrl"; }
  gnss_lto
  mkdir -p "$ROOT/omandroid/gnss"
  mount -t tmpfs -o mode=0755,nosuid,nodev,noexec gnss-etc "$ROOT/omandroid/gnss"
  gnss_config "$ROOT/omandroid/gnss"
}

# One command to gpsd's control pipe (gps.xml CtrlPipe). open() of a FIFO
# blocks until gpsd reads it, and gpsd reopens it after each writer, so
# every command is bounded and gets its own open.
gnss_ctrl() {
  /usr/bin/timeout "${2:-5}" /usr/bin/bash -c 'printf "%s\r\n" "$1" > "$2"' _ "$1" "$GNSS_CTRL"
}

# Time: the system clock, when NTP says it is right, as UTC milliseconds
# since 1970 with 1 s uncertainty. gpsd's control-pipe parser takes
# "ref_time,utc,<ms>,unc_ms,<ms>" (it logs "IRMSetRefTime:: ulUtcOffsetMs").
# Stock's IgnoreInjectedSystemTime applies to the Android HAL's injectTime,
# not to this path. Not sent when unsure: a wrong time slows the search.
gnss_inject_time() {
  ((GNSS_CONF_INJECT_TIME)) || return 0
  local sync
  sync=$(timedatectl show -p NTPSynchronized --value 2>/dev/null || true)
  if [[ $sync != yes && ! -e /run/systemd/timesync/synchronized ]]; then
    say "time: the system clock is not NTP-synchronized; not injected"
    return 0
  fi
  if gnss_ctrl "\$pglirm,ref_time,utc,$(date +%s%3N),unc_ms,1000"; then
    say "time: injected the system time (1 s uncertainty)"
  else
    say "time: control pipe write failed or timed out"
  fi
}

# Position: only the user's REF_POSITION (opt-in, /etc/omandroid/gnss.conf),
# as "set_aid,pos,Lat,..,Lon,..,HorAcc,.." (gpsd's names; its defaults are
# a 10 km horizontal and 3 km vertical uncertainty around 50 m altitude).
gnss_inject_position() {
  [[ -n $GNSS_CONF_REF_POSITION ]] || return 0
  local lat lon acc
  IFS=, read -r lat lon acc <<< "$GNSS_CONF_REF_POSITION"
  acc=${acc:-30000}
  if gnss_ctrl "\$pglirm,set_aid,pos,Lat,$lat,Lon,$lon,HorAcc,$acc"; then
    say "position: injected the configured reference position (${acc} m)"
  else
    say "position: control pipe write failed or timed out"
  fi
}

# Ask gpsd for a continuous position request once its control pipe
# exists, after the time and position aiding. Runs detached from the
# supervisor's job table, so its end does not count as "a service exited".
gnss_request() {
  local i
  for ((i = 0; i < 60; i++)); do
    if [[ -p $GNSS_CTRL ]]; then
      sleep 2
      gnss_inject_time
      sleep 0.5
      gnss_inject_position
      sleep 0.5
      say "control pipe: req_pos"
      gnss_ctrl '$pglirm,req_pos,omandroid,period,1000' ||
        say "control pipe: write failed or timed out"
      return 0
    elif [[ -e $GNSS_CTRL ]]; then
      say "control pipe $GNSS_CTRL is not a FIFO ($(stat -c %F "$GNSS_CTRL")); no request sent"
      return 1
    fi
    sleep 1
  done
  say "no control pipe $GNSS_CTRL after 60 s"
}

# The graceful stop, on the host while gpsd still runs
# (omandroid-gnss.service ExecStop= runs "omandroid-vendor-chroot gnss stop"
# before systemd signals anything): end the request the way a client
# would, so the engine closes its session and can write what it learned
# (ephemeris, position, clock; gpsd's NV file gldata.sto in
# /data/vendor/gps) for a faster next start. Bounded: at most 2 + 2 s.
profile_stop() {
  [[ $GNSS_REQ == 1 && -p $GNSS_CTRL ]] || return 0
  # The NMEA bridge may already be gone: keep a reader on the FIFO so
  # gpsd's last sentences don't hit a reader-less pipe meanwhile.
  local nmea=$STATE/data/vendor/gps/nmea_out
  [[ -p $nmea ]] && { /usr/bin/timeout 5 /usr/bin/cat "$nmea" > /dev/null 2>&1 & }
  if gnss_ctrl '$pglirm,stop,omandroid' 2; then
    say "control pipe: stop; 2 s for gpsd to finish"
    sleep 2
  fi
}

profile_start() {
  spawn lhd vendor /vendor/bin/hw/lhd /omandroid/gnss/lhd.conf
  [[ $GNSS_STAGE == lhd ]] && return
  sleep 2
  if [[ -n $GNSS_JOB ]]; then
    spawn gpsd vendor /vendor/bin/hw/gpsd -c /omandroid/gnss/gps.xml "$GNSS_JOB"
  else
    spawn gpsd vendor /vendor/bin/hw/gpsd -c /omandroid/gnss/gps.xml
  fi
  if [[ $GNSS_REQ == 1 ]]; then
    gnss_request &
    disown $!
  fi
}
