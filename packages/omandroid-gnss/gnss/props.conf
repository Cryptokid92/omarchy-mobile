# SPDX-License-Identifier: MIT
# Property overrides for the gnss vendor-chroot profile, applied after the
# image's build.prop files. Installed as /usr/lib/omandroid-vendor/gnss/props.conf;
# per-phone tweaks go in /var/lib/omandroid-vendor/gnss/props.conf.

# What Android's init would have set from the bootloader.
ro.boot.hardware.platform=gs201
ro.hardware=cheetah
ro.build.type=user
ro.debuggable=0

# bionic's resolver without netd (ANDROID_DNS_MODE=local) asks these.
net.dns1=1.1.1.1
net.dns2=9.9.9.9
