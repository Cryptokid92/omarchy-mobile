# SPDX-License-Identifier: MIT
# Omandroid GNSS settings (omandroid-gnss). KEY=VALUE, one per line; the
# values shown are the defaults. Read when the receiver starts, so changes
# apply from its next start (omandroid-gnss off; omandroid-gnss on).
# device/cheetah/GNSS-PLAN.md, section 7.

# Assistance data from Broadcom's servers, as stock Android uses them:
#  - the orbit predictions file (LTO, ~120 KB, valid ~4 days), downloaded
#    by omandroid-gnss-lto.timer while Location is on and before each start;
#  - gpsd's own short downloads of real-time orbits and satellite health
#    (gps.xml RtoEnable/RtiEnable).
# Plain HTTP requests with no account and no identifiers; the server sees
# the phone's IP address. 0 turns all of it off (slower first fixes).
ASSISTANCE=1
#LTO_URL=http://gllto2.glpals.com/4day/v5/latest/lto2.dat
# Download again when the file is older than this many hours.
#LTO_MAX_AGE_HOURS=20
# 1 also downloads over a cellular link.
#LTO_CELLULAR=0

# Give the engine the system time when it is NTP-synchronized (no network
# traffic of its own).
INJECT_TIME=1

# Optional coarse position to start from, "latitude,longitude[,accuracy_m]"
# in degrees (WGS84), e.g. a city: 52.52,13.40,30000. Stays on this phone,
# given only to the GNSS engine. Empty: none (the engine still remembers
# its own last fix in /var/lib/omandroid-vendor/gnss).
REF_POSITION=

# SUPL (A-GNSS from a SUPL server, TLS on port 7275). Off by default: the
# server learns the phone's IP address and when it looks for a fix. The
# protocol also carries a SET ID (on Android the SIM's IMSI, asked from the
# framework; with no framework and no SIM here, what gpsd sends instead is
# untested), cell IDs (none here: no modem, and stock already sends dummy
# cell info) and, in MS-assisted mode, measurements the server turns into
# a position. 1 turns it on with the server below. Experimental.
SUPL=0
#SUPL_SERVER=supl.google.com:7275
