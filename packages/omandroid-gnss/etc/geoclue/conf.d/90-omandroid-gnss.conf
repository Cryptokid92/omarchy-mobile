# SPDX-License-Identifier: MIT
# GeoClue: the phone's GNSS through omandroid-gnss-nmea. Connecting to the
# socket starts the GNSS stack on demand when the Location switch is on
# (omandroid-gnss on); otherwise the socket is absent and this source idles.
[network-nmea]
enable=true
nmea-socket=/run/omandroid-gnss/nmea.sock

# GeoClue serves a user's apps only while an agent is registered for that
# user: omandroid-geoclue-agent.service (GeoClue's demo agent), enabled by
# "omandroid-gnss on". The apps below are let through without asking it;
# any other app gets a notification. The Location switch is the user's
# control: off, there is no agent and nothing starts the receiver.
[firefox]
allowed=true
system=true
users=

[chromium]
allowed=true
system=true
users=

[org.gnome.Maps]
allowed=true
system=true
users=

[org.gnome.Weather]
allowed=true
system=true
users=

[geoclue-where-am-i]
allowed=true
system=true
users=
