# SPDX-License-Identifier: MIT
# GeoClue: the phone's GNSS through omandroid-gnss-nmea. Connecting to the
# socket starts the GNSS stack on demand when the Location switch is on
# (omandroid-gnss on); otherwise the socket is absent and this source idles.
[network-nmea]
enable=true
nmea-socket=/run/omandroid-gnss/nmea.sock

# Omarchy has no GeoClue agent to ask the user, so GeoClue would refuse
# ordinary apps. These are let through as "system" apps (no prompt). The
# Location switch is the user's control: off, nothing starts the receiver.
[firefox]
allowed=true
system=true
users=

[chromium]
allowed=true
system=true
users=

[org.gnome.Maps]
allowed=true
system=true
users=

[org.gnome.Weather]
allowed=true
system=true
users=

[where-am-i]
allowed=true
system=true
users=
