# The AoC sound card on tegu (Pixel 9a), card name "google,tegu-aoc-snd-card".
# Same reasoning as 51-omamobile-aoc.conf (cheetah): no mmap, stock's deep
# buffer periods, software volume only, named like a built-in card.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*", api.alsa.card.name = "google,tegu-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Audio"
        device.form-factor = "internal"
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*", api.alsa.card.name = "google,tegu-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Speaker"
        api.alsa.disable-mmap = true
        # No speaker protection runs on the 9a yet: PipeWire's 100 % would be
        # full scale into stock's amplifier gains. Clamp the sink at about
        # -10 dB (linear; 1.0 is 0 dB) until the speakers' limits are measured
        # or a protection path exists. The clamp applies to both the master
        # and the channel volumes, which the channel mixer multiplies, so the
        # ceiling is the square of the value: 0.562 squared is 0.316, -10 dB.
        # Only this card: Bluetooth and USB audio keep their own volume.
        channelmix.max-volume = 0.562
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*", api.alsa.card.name = "google,tegu-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Microphone"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
]
