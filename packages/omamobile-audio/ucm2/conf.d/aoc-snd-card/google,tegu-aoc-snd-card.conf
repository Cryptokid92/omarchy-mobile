# Pixel 9a (tegu, zumapro): the AoC sound card (card driver name
# "aoc-snd-card", card name "google,tegu-aoc-snd-card"; alsa-ucm-conf tries
# conf.d/<driver>/<long name>.conf before conf.d/<driver>/<driver>.conf, so
# this file wins over cheetah's aoc-snd-card.conf). Speaker through the
# mainline tas2781 codecs on TDM 0, microphones 0 and 1 through the AoC.
Syntax 6

SectionUseCase."HiFi" {
	File "/Google/tegu/HiFi.conf"
	Comment "Speaker and microphones"
}
