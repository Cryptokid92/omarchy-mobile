# SPDX-License-Identifier: MIT
# "Voice Call" verb for the AoC sound card on cheetah (AOC-PLAN.md "Earpiece
# and calls", TELEPHONY-APPS-PLAN.md 2.3). Nothing selects it by default:
# HiFi stays the card's profile, and a call client (callaudiod, or by hand
# with alsaucm) has to ask for this verb and one of its devices.
#
# The call itself never passes through the application processor: the AoC
# and the modem exchange the voice frames, and omamobile-sitd's call audio
# (voice_audio.py) owns the AoC's voice mixers (TDM_0_RX Mixer EP5, EP4 TX
# Mixer INTERNAL_MIC_TX, the Voice Call controls) and the two hostless PCMs
# (4 and 11) for the length of the call, and restores them after. So this
# verb names no PCM and sets none of those: its job is the amplifiers' mode.
#
#   Earpiece  the top amplifier alone with its DSP bypassed, as stock's
#             handset path, at analog 6 or less and digital 737 or less, the
#             bottom amplifier muted (omamobile-speaker-protection mode
#             earpiece, through omamobile-speaker-mode@earpiece.service, which
#             the active local user may start: polkit rule
#             50-omamobile-speaker-mode.rules). The lowest priority, never a
#             default.
#   Speaker   speakerphone: both amplifiers through their DSPs at the stage's
#             levels (stage media: 737 / 10), as for media. Stock's 800 / 17
#             speakerphone waits on C9.
#   Mic       the built-in microphones; the uplink route belongs to sitd.
#
# The mode requests run synchronously, so the earpiece mode is in force
# before the device counts as enabled. Leaving the earpiece (its disable
# sequence) returns to speaker mode. Nothing here touches an amplifier
# control directly: omamobile-speaker-protection checks the ceilings, and its
# watchdog mutes on anything the mode doesn't allow.

SectionVerb {
	EnableSequence [
		# TDM 0 in stock's format, as HiFi sets it
		cset "name='TDM_0_RX Chan' Four"
		cset "name='TDM_0_RX Format' S32_LE"
		cset "name='TDM_0_RX Sample Rate' SR_48K"
		cset "name='TDM_0_TX Chan' Four"
		cset "name='TDM_0_TX Format' S32_LE"
		cset "name='TDM_0_TX Sample Rate' SR_48K"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		exec "/usr/bin/systemctl start omamobile-speaker-mode@earpiece.service"
	]

	DisableSequence [
		exec "/usr/bin/systemctl start omamobile-speaker-mode@speaker.service"
	]

	Value {
		PlaybackPriority 100
	}
}

SectionDevice."Speaker" {
	Comment "Speakerphone"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		exec "/usr/bin/systemctl start omamobile-speaker-mode@speaker.service"
	]

	Value {
		PlaybackPriority 200
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		CapturePriority 100
	}
}
