# SPDX-License-Identifier: MIT
# HiFi verb for the AoC sound card on tegu (Pixel 9a):
#
#   Speaker  deep-buffer playback, AoC entry point 6 ("EP6 playback", stock
#            PCM 5), routed to TDM 0, where the two TAS2572 amplifiers (Top,
#            Bottom; mainline tas2781 driver with linux-firmware's TAS2572
#            RCA profile) take their slots.
#   Mic      recording, AoC entry point 1 ("EP1 capture", stock PCM 8), from
#            the built-in PDM microphones 0 and 1 (left and right channel).
#            The third microphone (id 2) answers "Could not enable power for
#            PDM 2" in the AoC log on this kernel, so it is left out; an id
#            that does not exist (cheetah's 0,3,2) makes the AoC assert in
#            mic_compensation.cc SetPdmMask and die until a reboot. Never put
#            a cheetah mic list on this card.
#
# The routes are set by the verb rather than by each device: an ASoC DPCM
# front end with no back end connected fails at prepare, and PipeWire opens
# the PCMs while it probes the profile.
#
# Nothing here touches the amplifiers' or the AoC's volume controls: the
# tas2781 driver's volume controls are rewritten by the RCA profile at
# playback start (device/tegu/NOTES.md, the 2026-10-26 audio entry), so PipeWire's software volume is the
# level control.

SectionVerb {
	EnableSequence [
		# TDM 0 as stock sets it at init: four 32-bit slots at 48 kHz.
		cset "name='TDM_0_RX Chan' Four"
		cset "name='TDM_0_RX Format' S32_LE"
		cset "name='TDM_0_RX Sample Rate' SR_48K"
		cset "name='TDM_0_TX Chan' Four"
		cset "name='TDM_0_TX Format' S32_LE"
		cset "name='TDM_0_TX Sample Rate' SR_48K"

		# deep-buffer-playbackP: EP6 to TDM 0
		cset "name='TDM_0_RX Mixer EP6' 1"

		# recording: microphones 0 and 1, the DC blocker and the record gain
		# cheetah's profile uses (22 dB; the PDM mics read -79 dBFS of room
		# noise without it)
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,1,-1,-1"
		cset "name='MIC DC Blocker' 1"
		cset "name='MIC Record Soft Gain (dB)' 22"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 1"
	]

	DisableSequence [
		cset "name='TDM_0_RX Mixer EP6' 0"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^EP6 playback'}"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},${find-device:type=pcm,stream=capture,field=id,regex='^EP1 capture'}"
		CaptureChannels 2
		CaptureRate 48000
	}
}
