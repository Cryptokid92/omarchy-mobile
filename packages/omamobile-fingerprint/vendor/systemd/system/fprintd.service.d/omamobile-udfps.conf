# SPDX-License-Identifier: MIT
# libfprint's omamobile_udfps driver finds the sensor through this variable:
# the socket of omamobile-fp-bridge (omamobile-fp.service). Without the
# bridge running, fprintd lists no device and the lock falls back to the
# password.
[Service]
Environment=FP_OMAMOBILE_UDFPS=/run/omamobile-fp/sock/bridge.sock
