# SPDX-License-Identifier: MIT
# The under-display fingerprint sensor needs the panel's local high
# brightness mode (LHBM): a bright circle over the sensor while a finger is
# on it. panel_samsung_s6e3hc4 refuses LHBM unless allow_lhbm is set; only
# omamobile-fp-bridge turns it on, during a touch on the sensor, and the
# panel driver turns it off again after at most 3 s
# (device/cheetah/FINGERPRINT-PLAN.md F7).
options panel_samsung_s6e3hc4 allow_lhbm=1
