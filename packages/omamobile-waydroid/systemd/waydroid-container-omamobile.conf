# omamobile-waydroid: before every container start, refuse to run on a kernel
# without what Android needs, and put back the hardening (no debugfs, camera
# or framebuffer nodes in the container; no block devices) in case a
# "waydroid upgrade" regenerated the LXC config. WAYDROID-PLAN.md W3.
[Unit]
After=network-online.target ufw.service
Wants=network-online.target

[Service]
ExecStartPre=/usr/lib/omamobile-waydroid/omamobile-waydroid-check
ExecStartPre=/usr/lib/omamobile-waydroid/omamobile-waydroid-harden config /
ExecStartPre=/usr/lib/omamobile-waydroid/omamobile-waydroid-harden verify /
