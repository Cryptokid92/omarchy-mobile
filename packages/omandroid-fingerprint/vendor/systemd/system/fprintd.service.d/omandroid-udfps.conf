# SPDX-License-Identifier: MIT
# libfprint's omandroid_udfps driver finds the sensor through this variable:
# the socket of omandroid-fp-bridge (omandroid-fp.service). Without the
# bridge running, fprintd lists no device and the lock falls back to the
# password.
[Service]
Environment=FP_OMANDROID_UDFPS=/run/omandroid-fp/sock/bridge.sock
