# SPDX-License-Identifier: MIT
# Omarchy Mobile: SSH with keys only. root logs in with the key the installer
# put in /root/.ssh/authorized_keys (its password stays locked); ufw allows
# port 22 on the USB link (usb0) only.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
