# SPDX-License-Identifier: MIT
# omandroid-sitd settings (device/cheetah/MODEM-CLIENT.md). Changes apply at
# the next "systemctl restart omandroid-sitd".

[modem]
# The SIT channel for SIM slot 0.
device = /dev/umts_ipc0
# "off" leaves the radio off (first runs); "omandroid-sit radio on" later.
radio = on
# Seconds to wait for IND_RADIO_READY before going on.
radio_ready_timeout = 5
# Start-up requests stock sends before radio power. Off: the spec says try
# without them first, and turn one on only if the modem refuses radio power.
modem_config = no
slot_mapping = no
ap_time = no
request_timeout = 15
# Registration poll intervals (seconds), besides IND_NTW_STATE_CHANGED.
poll_searching = 10
poll_registered = 60

[data]
# The mobile data switch's default; "omandroid-sit data on|off" (and the
# quick settings tile) override it and the choice is kept in
# /var/lib/omandroid-sit/mobile-data.
enabled = no
# The carrier's APN. Leave the credentials empty unless the carrier says
# otherwise. auth: none, pap, chap, papchap. pdp: ipv4, ipv6, ipv4v6.
apn =
user =
password =
auth = none
pdp = ipv4v6
# Data while roaming (registration state 5).
roaming = no
# Send the APN as the initial attach APN as well (SET_INITIAL_ATTACH_APN).
initial_attach = yes
# The data call's context ID; it runs on rmnet<cid-1>.
cid = 1
# Empty keeps the netdev's MTU.
mtu =
# Default-route metric: above Wi-Fi's, so Wi-Fi wins while it is up.
metric = 700
# DNS: auto (resolvectl when systemd-resolved runs, else
# /run/omandroid-sit/resolv.conf), resolvectl, file or none.
dns = auto
# Seconds between data call attempts after a failure.
retry = 30

# Per-SIM APNs: a section named apn.<MCC><MNC> applies to SIMs whose IMSI
# starts with that PLMN (the longest match wins), e.g.
# [apn.00101]
# apn = test.apn

[sms]
# Keep received SMS in /var/lib/omandroid-sit/sms (mode 0600).
store = yes

[control]
# Members of this group may switch data and the radio, send and read SMS
# over the control socket; everyone may read the status.
group = wheel
