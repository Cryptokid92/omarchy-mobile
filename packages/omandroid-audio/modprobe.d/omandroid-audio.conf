# The speaker amplifiers (AOC-PLAN.md stage C8): only
# omandroid-speaker-protection loads their driver, so the AoC sound card (which
# waits for both amplifiers) comes up only through the service that mutes them
# at once and unmutes them only with the protection firmware and the factory
# calibration in place. Explicit modprobe still works for bring-up.
blacklist snd_soc_cs35l41_spi
