# SPDX-License-Identifier: MIT
# Speaker settings for omandroid-speaker-protection and its watchdog
# (device/cheetah/AOC-PLAN.md stages C8 and C9). PipeWire's volume (keys,
# quick settings) works on top of these in software; these are the
# amplifiers' own levels with the protection firmware running.
#
# Stage: media (default) is the everyday level until stock's gains are
# proven: digital <= 737 (-10 dB), analog <= 10 on both amplifiers, inside
# AUDIO-PLAN.md section 4's limits even without protection. c8 is bring-up
# (digital <= 657, analog <= 6 top, <= 10 bottom). c9 allows stock's 817 / 17,
# but only with aoc_alsa_dev speaker_protection=1 and a verification stamp for
# the installed firmware (omandroid-speaker-protection verify, C9a).
#OMANDROID_SPK_STAGE=media
#
# Levels for both amplifiers, and per amplifier (overriding them):
# (defaults: media 737 / 10, c8 and c9 657 / 6)
#OMANDROID_SPK_DIGITAL=737
#OMANDROID_SPK_ANALOG=10
#OMANDROID_SPK_TOP_DIGITAL=
#OMANDROID_SPK_TOP_ANALOG=
#OMANDROID_SPK_BOTTOM_DIGITAL=
#OMANDROID_SPK_BOTTOM_ANALOG=
#
# Stock's media "fast use case" delta (vendor fast_switch3/4, "Bypass FIR"),
# written to both DSPs at each stream start by the watchdog (C9b). Default:
# on when both delta files are installed (tools/extract-vendor-firmware).
#OMANDROID_SPK_MEDIA_DELTA=1
#
# The amplifiers' DRE (dynamic range enhancement), on in stock (and by default
# here since 0.3.2): 0 = off.
#OMANDROID_SPK_DRE=1
# The amplifiers' hardware noise gate (stock enables it): 1 = on.
#OMANDROID_SPK_NOISE_GATE=1
#
# The watchdog's coil temperature backstop in degrees C (the firmware's own
# thermal protection acts first):
#OMANDROID_SPK_TEMP_MAX=80
# ... and on a rise of more than this many degrees within one stream (a
# real coil moves by tenths of a degree; AOC-PLAN C9d-3..5):
#OMANDROID_SPK_TEMP_JUMP=5
#
# The amplifiers' VMON/IMON stream to the AoC (the hostless capture, PCM 15),
# which stock runs with every speaker stream (AOC-PLAN.md C9d-7). Needs the
# aoc-sound-test overlay's interleaved TX slots; off until C9d-7 has run:
#OMANDROID_SPK_FEEDBACK=1
