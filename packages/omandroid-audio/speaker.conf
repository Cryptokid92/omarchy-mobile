# SPDX-License-Identifier: MIT
# Speaker levels for omandroid-speaker-protection (AOC-PLAN.md stage C8).
# PipeWire's volume (keys, quick settings) works on top of these in software;
# these are the amplifiers' own levels with the protection firmware running.
#
# Digital PCM Volume after unmute: 1..657 (657 = -20 dB; 817 = 0 dB is stage C9)
#OMANDROID_SPK_DIGITAL=657
# Analog PCM Volume: 0..10 (0.5 dB + 1 dB per step; stock is 17 with protection, stage C9)
#OMANDROID_SPK_ANALOG=6
