# Loudness for the built-in speakers, before the amplifiers' protection DSP
# (device/cheetah/AOC-PLAN.md C9). Phone speakers can't move air below about
# 150 Hz, so a high-pass there frees headroom, and a look-ahead limiter keeps
# peaks 3 dB under full scale. With 6 dB of make-up gain the listener heard
# music distorted at full volume (heavy limiting, and the bottom path
# overloading), so there is none. The amplifiers stay at the
# stage's levels and ceilings (omandroid-speaker-protection): only the signal
# into the DSP changes, which the protection firmware sees and tracks.
# A smart filter: WirePlumber puts it in front of the speaker sink only, so
# Bluetooth and USB audio are untouched.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker loudness"
            media.name = "Speaker loudness"
            filter.graph = {
                nodes = [
                    { type = builtin name = highpass_l label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
                    { type = builtin name = highpass_r label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
                    {
                        type = ladspa
                        name = limiter
                        plugin = fast_lookahead_limiter_1913
                        label = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.1 }
                    }
                ]
                links = [
                    { output = "highpass_l:Out" input = "limiter:Input 1" }
                    { output = "highpass_r:Out" input = "limiter:Input 2" }
                ]
                inputs = [ "highpass_l:In" "highpass_r:In" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "effect_input.omandroid_speaker_loudness"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "omandroid-speaker-loudness"
                filter.smart.target = { node.name = "alsa_output.platform-sound-aoc.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name = "effect_output.omandroid_speaker_loudness"
                node.passive = true
            }
        }
    }
]
