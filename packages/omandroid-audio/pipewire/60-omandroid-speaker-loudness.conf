# SPDX-License-Identifier: MIT
# Tone and level shaping for the built-in speakers, before the amplifiers'
# protection DSP (device/cheetah/AOC-PLAN.md C9g). Left is the top speaker
# (the earpiece), right the bottom loudspeaker, as stock maps them.
#
# Stock shapes the speaker signal on the AoC (Waves; AOC-TUNING-RESEARCH.md),
# which we don't send yet, so without this the phone plays flat and sounds
# thin. Per channel, in order:
#   hp      high-pass, 2nd order: below about 100 Hz these speakers make no
#           sound, only cone excursion and limiter work (0.3.3-0.3.5 had it at
#           150 Hz, which cut into what they can still play)
#   bass    low shelf: lifts what the speakers can play below their own
#           roll-off (a "loudness" contour: at our level, 17 dB under stock,
#           the ear hears bass least)
#   dip     peaking cut in the presence region, where micro-speakers are
#           harsh
#   treble  high shelf (flat by default; for the earpiece's brightness)
#   trim    channel level (linear factor), for the balance between the two
# then a look-ahead limiter at -3 dBFS with no gain: it only catches the peaks
# the bass lift adds, so nothing reaches the amplifiers above full scale.
# The amplifiers stay at the stage's levels and ceilings
# (omandroid-speaker-protection); the protection firmware sees and tracks the
# shaped signal, and its excursion limiter assumes stock's higher analog gain.
#
# Every value can be changed while playing, for listening tests:
#   omandroid-speaker-eq show | preset default|flat|waves | set bass=3 ...
# (until PipeWire restarts; its "default" preset reads this file).
# "omandroid-speaker-eq save" keeps the user's values in a copy of this file
# under ~/.config/pipewire/pipewire.conf.d/ that sets omandroid.speaker-eq to
# "user", and this module then stays unloaded (its condition).
# A smart filter: WirePlumber puts it in front of the speaker sink only, so
# Bluetooth and USB audio are untouched.
context.properties = {
    omandroid.speaker-eq = package
}
context.modules = [
    { name = libpipewire-module-filter-chain
        condition = [ { omandroid.speaker-eq = package } ]
        args = {
            node.description = "Speaker loudness"
            media.name = "Speaker loudness"
            filter.graph = {
                nodes = [
                    { type = builtin name = hp_l     label = bq_highpass  control = { "Freq" = 100.0 "Q" = 0.707 } }
                    { type = builtin name = hp_r     label = bq_highpass  control = { "Freq" = 100.0 "Q" = 0.707 } }
                    { type = builtin name = bass_l   label = bq_lowshelf  control = { "Freq" = 400.0 "Q" = 0.707 "Gain" = 4.0 } }
                    { type = builtin name = bass_r   label = bq_lowshelf  control = { "Freq" = 400.0 "Q" = 0.707 "Gain" = 4.0 } }
                    { type = builtin name = dip_l    label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.2 "Gain" = -2.0 } }
                    { type = builtin name = dip_r    label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.2 "Gain" = -2.0 } }
                    { type = builtin name = treble_l label = bq_highshelf control = { "Freq" = 6000.0 "Q" = 0.707 "Gain" = 0.0 } }
                    { type = builtin name = treble_r label = bq_highshelf control = { "Freq" = 6000.0 "Q" = 0.707 "Gain" = 0.0 } }
                    { type = builtin name = trim_l   label = linear       control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin name = trim_r   label = linear       control = { "Mult" = 1.0 "Add" = 0.0 } }
                    {
                        type = ladspa
                        name = limiter
                        plugin = fast_lookahead_limiter_1913
                        label = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.2 }
                    }
                ]
                links = [
                    { output = "hp_l:Out"     input = "bass_l:In" }
                    { output = "bass_l:Out"   input = "dip_l:In" }
                    { output = "dip_l:Out"    input = "treble_l:In" }
                    { output = "treble_l:Out" input = "trim_l:In" }
                    { output = "trim_l:Out"   input = "limiter:Input 1" }
                    { output = "hp_r:Out"     input = "bass_r:In" }
                    { output = "bass_r:Out"   input = "dip_r:In" }
                    { output = "dip_r:Out"    input = "treble_r:In" }
                    { output = "treble_r:Out" input = "trim_r:In" }
                    { output = "trim_r:Out"   input = "limiter:Input 2" }
                ]
                inputs = [ "hp_l:In" "hp_r:In" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "effect_input.omandroid_speaker_loudness"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "omandroid-speaker-loudness"
                filter.smart.target = { node.name = "alsa_output.platform-sound-aoc.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name = "effect_output.omandroid_speaker_loudness"
                node.passive = true
            }
        }
    }
]
