# Property overrides for the modem vendor-chroot profile, applied after the
# image's build.prop files (which already set ro.vendor.cbd.modem_type).
# Installed as /usr/lib/omandroid-vendor/modem/props.conf; per-phone tweaks
# go in /var/lib/omandroid-vendor/modem/props.conf.
# device/cheetah/MODEM-PLAN.md M3.

# What Android's init would have set from the bootloader. The slot is the
# one the RAM copy of the modem image is named after (by-name/modem_a).
ro.boot.hardware.platform=gs201
ro.hardware=cheetah
ro.build.type=user
ro.debuggable=0
ro.bootmode=unknown
ro.boot.slot_suffix=_a
vendor.cbd.partition=modem_a

# Pinned so that cbd and rfsd take their normal-boot paths only. Their NV
# is a RAM copy either way (profiles/modem.conf); these keep a surprise
# from costing even that copy. Stock leaves the first three unset.
persist.vendor.modem.efs.clear.action=
persist.vendor.cbd.modem.bootmode=
persist.vendor.modem.recovery.enabled=false
persist.vendor.radio.no_modem_board=false
persist.vendor.sys.modem.logging.enable=false
vendor.sys.modem.logging.enable=false
