# Speaker tuning: stock's Waves MaxxAudio on the AoC, configured by Waves'
# own controller from your vendor files (omandroid-speaker-tuning,
# device/cheetah/AOC-TUNING-RESEARCH.md). Settings here, or in
# /etc/omandroid/speaker.conf (read first; this file overrides it).
#
#   off       (default) nothing is sent: the AoC plays the speaker flat
#   throttle  SPEAKER_MUSIC_THROTTLE, stock's lower-power battery mode
#   music     SPEAKER_MUSIC; only with the speaker protection verification
#             stamp (AOC-PLAN.md C9a)
# Tuning is sent only while omandroid-speaker-watch runs. Waves raises the
# average level into the amplifiers; their ceilings are unchanged.
#OMANDROID_SPK_TUNING=off
#
# The volume Waves' volume-dependent laws see, 0..1 (stock passes the
# stream volume; phase 2):
#OMANDROID_SPK_TUNING_VOLUME=1.0
#
# Which landscape side is 90 degrees for Waves: iio-sensor-proxy's
# left-up (90, default) or right-up (270). AOC-TUNING-RESEARCH.md T4.3.
#OMANDROID_SPK_TUNING_LEFT_UP=90
