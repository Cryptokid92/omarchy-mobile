# Charging policy for max77759_charger, which stays blacklisted
# (omamobile-max77759.conf) until USB-C-PLAN gate B3 passes. The battery
# temperature guard (USB-C-PLAN.md gate B3g) must be on before the charger
# loads by default. Off until its runbook passes; then uncomment:
#options max77759_charger temp_guard=1
