# The four cameras of cheetah, named for camera apps (device/cheetah/CAMERA-PLAN.md
# CAM5.4). libcamera names a camera by its sensor's DT path; the sensor at
# each address, as the drivers bound on the phone report it:
#   hsi2c_1 0x3d  Samsung S5KGN1  main (wide)
#   hsi2c_3 0x1a  Sony IMX386     ultrawide
#   hsi2c_4 0x2d  Samsung S5KGM5  telephoto
#   hsi2c_2 0x10  Samsung S5K3J1  front
# The main camera gets the highest priority, so apps open it first.
monitor.libcamera.rules = [
  {
    matches = [ { api.libcamera.path = "/base/soc@0/usi@109000c0/i2c@10900000/camera-sensor@3d" } ]
    actions = { update-props = { node.description = "Main camera", node.nick = "Main camera", priority.session = 1000 } }
  }
  {
    matches = [ { api.libcamera.path = "/base/soc@0/usi@109200c0/i2c@10920000/camera-sensor@1a" } ]
    actions = { update-props = { node.description = "Ultrawide camera", node.nick = "Ultrawide camera", priority.session = 900 } }
  }
  {
    matches = [ { api.libcamera.path = "/base/soc@0/usi@109300c0/i2c@10930000/camera-sensor@2d" } ]
    actions = { update-props = { node.description = "Telephoto camera", node.nick = "Telephoto camera", priority.session = 850 } }
  }
  {
    matches = [ { api.libcamera.path = "/base/soc@0/usi@109100c0/i2c@10910000/camera-sensor@10" } ]
    actions = { update-props = { node.description = "Front camera", node.nick = "Front camera", priority.session = 950 } }
  }
]

# The CSIS write DMA's own video nodes carry raw Bayer frames that only
# libcamera can use, and an app opening one would hold the camera: keep
# them out of PipeWire.
monitor.v4l2.rules = [
  {
    matches = [ { device.name = "~v4l2_device.platform-1a4.0000.csis" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
