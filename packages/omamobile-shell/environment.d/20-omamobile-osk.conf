# SPDX-License-Identifier: MIT
# Omarchy Mobile: text fields talk to the on-screen keyboard through Wayland's
# text-input protocol, which Hyprland hands to squeekboard. Overrides Omarchy's
# 10-omarchy-fcitx.conf (fcitx5 is for desktop compose sequences).
# environment.d can't unset a variable (an empty value is a syntax error), so
# the fcitx ones get explicit "no input method" values.
INPUT_METHOD=none
QT_IM_MODULE=wayland
GTK_IM_MODULE=wayland
XMODIFIERS=@im=none
SDL_IM_MODULE=none
