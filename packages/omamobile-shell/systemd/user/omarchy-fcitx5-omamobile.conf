# Omarchy Mobile: squeekboard (the on-screen keyboard) needs Hyprland's
# input-method slot, which Omarchy's fcitx5 would take. A condition, not a
# mask: Omarchy's first run enables this unit with `enable --now`, which fails
# on a masked unit and then repeats first run (and its notifications) at every
# login. To run fcitx5 anyway: touch ~/.config/omamobile/fcitx5
[Unit]
ConditionPathExists=%h/.config/omamobile/fcitx5
