# Omarchy Mobile (omamobile-shell): the permission question ("Allow Camera to
# use the camera?") as the phone shell's sheet, not GTK's desktop dialog.
# xdg-desktop-portal reads this before /usr/share/xdg-desktop-portal/
# hyprland-portals.conf and falls through to it for every other interface,
# so that file's default=hyprland;gtk still applies. gtk is the fallback if
# omamobile.portal is missing.
[preferred]
org.freedesktop.impl.portal.Access=omamobile;gtk
