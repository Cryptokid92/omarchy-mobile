# Omarchy Mobile (omamobile-shell): xdg-desktop-portal's backends on the phone.
# xdg-desktop-portal reads this before /usr/share/xdg-desktop-portal/
# hyprland-portals.conf and falls through to it for every other interface,
# so that file's default=hyprland;gtk still applies.
[preferred]
# The permission question ("Allow Camera to use the camera?") as the phone
# shell's sheet, not GTK's desktop dialog. gtk is the fallback if
# omamobile.portal is missing.
org.freedesktop.impl.portal.Access=omamobile;gtk
# Open, save and folder dialogs from xdg-desktop-portal-gnome: Nautilus's
# libadwaita file chooser, which adapts to the phone's 480 px (sidebar
# collapsed, touch-sized rows), instead of GTK 3's desktop chooser. Only the
# file chooser: the gnome backend's other interfaces need gnome-shell.
org.freedesktop.impl.portal.FileChooser=gnome;gtk
