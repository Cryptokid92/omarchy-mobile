# SPDX-License-Identifier: MIT
# omandroid-waydroid settings, read by omandroid-waydroid (WAYDROID-PLAN.md).
# Android system image for "omandroid-waydroid init": VANILLA (no Google),
# FOSS, or GAPPS (Google Play; the device must then be registered once by
# its owner at google.com/android/uncertified).
SYSTEM_TYPE=VANILLA
# Android's density: the shell's 3x scale (160 dpi * 3).
LCD_DENSITY=480
# One Hyprland window per Android app (Waydroid's multi-window mode).
MULTI_WINDOWS=true
