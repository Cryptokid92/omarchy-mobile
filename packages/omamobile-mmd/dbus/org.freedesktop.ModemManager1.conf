<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- omamobile-mmd: the bus policy ModemManager 1.24 ships for its polkit build
     (data/org.freedesktop.ModemManager1.conf.polkit), written out for the
     members omamobile-mmd serves. Only root owns the name; everyone may read
     and call the listed methods, which polkit then authorises. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.freedesktop.ModemManager1" send_type="method_call"/>
    <!-- Reading is open to everyone, as in ModemManager. -->
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <!-- The methods below are checked against polkit (or answer "not supported"). -->
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1" send_member="ScanDevices"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1" send_member="SetLogging"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="ListBearers"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="Enable"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="CreateBearer"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="DeleteBearer"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="SetPowerState"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="Reset"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="FactoryReset"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="SetCurrentCapabilities"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="SetCurrentModes"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem" send_member="SetCurrentBands"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Simple" send_member="GetStatus"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Simple" send_member="Connect"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Simple" send_member="Disconnect"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Modem3gpp" send_member="Register"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Modem3gpp" send_member="Scan"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Modem3gpp" send_member="SetEpsUeModeOperation"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Modem3gpp" send_member="SetInitialEpsBearerSettings"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Modem3gpp" send_member="DisableFacilityLock"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Modem3gpp" send_member="SetCarrierLock"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Sim" send_member="SendPin"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Sim" send_member="SendPuk"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Sim" send_member="EnablePin"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Sim" send_member="ChangePin"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Bearer" send_member="Connect"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Bearer" send_member="Disconnect"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Location" send_member="Setup"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Location" send_member="SetSuplServer"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Location" send_member="InjectAssistanceData"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Location" send_member="SetGpsRefreshRate"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Location" send_member="GetLocation"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Messaging" send_member="List"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Messaging" send_member="Create"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Messaging" send_member="Delete"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Sms" send_member="Store"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Sms" send_member="Send"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="ListCalls"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="CreateCall"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="DeleteCall"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="HoldAndAccept"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="HangupAndAccept"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="HangupAll"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="Transfer"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="CallWaitingSetup"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Voice" send_member="CallWaitingQuery"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Call" send_member="Start"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Call" send_member="Accept"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Call" send_member="Deflect"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Call" send_member="JoinMultiparty"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Call" send_member="LeaveMultiparty"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Call" send_member="Hangup"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Call" send_member="SendDtmf"/>
    <allow send_destination="org.freedesktop.ModemManager1" send_interface="org.freedesktop.ModemManager1.Modem.Signal" send_member="Setup"/>
  </policy>
</busconfig>
