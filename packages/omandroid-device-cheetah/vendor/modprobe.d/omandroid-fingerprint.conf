# SPDX-License-Identifier: MIT
# Fingerprint bring-up (device/cheetah/FINGERPRINT-RESEARCH.md, gates F2-F6):
# load these by hand, one gate at a time.
# - trusty_*: calls into the secure world at probe (the DT node is disabled
#   by default too). trusty_ipc must be loaded before trusty_virtio.
# - sg: SCSI generic is needed only for the UFS RPMB well-known LUN, but it
#   creates a raw SG_IO node for every LUN, which bypasses the block layer's
#   read-only guard on the calibration partitions. systemd-udevd would load
#   it for every SCSI device.
# - goodix_fp: switches the sensor supply and reset.
blacklist trusty_core
blacklist trusty_log
blacklist trusty_ipc
blacklist trusty_virtio
blacklist sg
blacklist goodix_fp
softdep trusty_virtio pre: trusty_ipc
