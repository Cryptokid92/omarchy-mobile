# Bluetooth (BCM4389 on the APM UART, BLUETOOTH-PLAN.md BT2): the chip
# doesn't acknowledge each Write RAM record of the firmware patch in time,
# so the download fails with "Patch command fc4c failed (-110)". Stream the
# records and wait only for Launch RAM (btbcm.patchram_nowait, ours).
options btbcm patchram_nowait=1
