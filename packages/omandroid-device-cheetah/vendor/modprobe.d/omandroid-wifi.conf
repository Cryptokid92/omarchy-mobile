# SPDX-License-Identifier: MIT
# Wi-Fi bring-up: load these by hand (device/cheetah/WIFI-BATTERY-PLAN.md,
# gates W1-W3). pcie_gs201 powers the BCM4389 (WL_REG_ON) and trains the PCIe
# link; brcmfmac loads the chip's firmware. Until gate W4 (the HSI2 S2MPU
# confines the chip's DMA) the chip can DMA anywhere in RAM, so neither may
# load on its own. Remove this file only after W4.
blacklist pcie_gs201
blacklist brcmfmac
