# Modem interface (Google's CPIF, ported; device/cheetah/MODEM-PLAN.md M3):
# only the runbook loads these, by hand, never at boot. With the
# modem-cpif-test overlay their device tree nodes match, so without this
# udev would load them and CPIF would take the modem's lines at boot.
blacklist cpif
blacklist shm_ipc
