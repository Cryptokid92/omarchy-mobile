# SPDX-License-Identifier: MIT
# ACPM bring-up (device/cheetah/ACPM-PLAN.md): the AP-APM mailbox, the ACPM
# protocol and its DVFS clocks are loaded by hand, one stage at a time
# (tools/acpm-stage a1, a2). The GPU's clock comes from clk_acpm, so on the
# ACPM kernel Panthor waits for stage a2 before it binds.
# After stage a4 passes, replace these lines with
#   options clk_acpm gs201_gpu_max_khz=572000
# (no GPU thermal limit exists yet, so keep a cap below 848000).
blacklist exynos_mailbox
blacklist acpm_protocol
blacklist clk_acpm
