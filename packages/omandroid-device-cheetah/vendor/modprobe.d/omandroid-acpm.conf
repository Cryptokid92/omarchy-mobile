# GPU frequency scaling through the ACPM firmware (device/cheetah/ACPM-PLAN.md,
# stages A1-A4 passed 2026-10-12). Panthor's clock comes from clk_acpm, so
# these modules load at boot. There is no GPU thermal limit yet, so cap the
# GPU at 572 MHz (of 848); raise it once GPU throttling exists.
options clk_acpm gs201_gpu_max_khz=572000
