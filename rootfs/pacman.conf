# SPDX-License-Identifier: MIT
# Omarchy Mobile's pacman.conf (from tools/build-rootfs, rootfs/pacman.conf).
# Order matters (AGENTS.md): [omamobile] first, so our Mesa, Hyprland and
# libcamera win; then Omarchy's aarch64 builds; then Arch Linux ARM's.
# Update with "omarchy update", not pacman -Syu.

[options]
HoldPkg = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[omamobile]
Include = /etc/pacman.d/omamobile-mirrorlist

[omarchy]
Server = https://pkgs.omarchy.org/@OMARCHY_CHANNEL@/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
