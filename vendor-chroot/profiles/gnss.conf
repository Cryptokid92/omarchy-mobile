# SPDX-License-Identifier: MIT
# Vendor-chroot profile "gnss": Broadcom's lhd (patch loader and chip link)
# and gpsd (the position engine) from the stock vendor image, driving the
# BCM4775x through the bcm4775x-gnss kernel driver (/dev/ttyBCM, /dev/bbd_*).
# device/cheetah/GNSS-PLAN.md.
#
# Output: NMEA on the FIFO /data/vendor/gps/nmea_out (gps.xml NmeaOutName),
# that is $STATE/data/vendor/gps/nmea_out on the host, which
# omandroid-gnss-nmea serves to GeoClue and gpsd.
# shellcheck shell=bash disable=SC2034

STATE=/var/lib/omandroid-vendor/gnss
# gpsd links libbinder_ndk (sensor fusion, wake locks): a private binderfs
# and servicemanager, with the sensor and suspend services reported absent
# by the shim at once.
BINDER=yes
NO_SERVICES="android.hardware.sensors.,android.hardware.gnss.,vendor.samsung_slsi.telephony."

GNSS_NODES=(ttyBCM bbd_control bbd_patch bbd_pwrstat bbd_sensor)
BINS=(/vendor/bin/hw/lhd /vendor/bin/hw/gpsd)
# gpsd's four SIT RIL calls (modem-assisted GNSS) succeed as no-ops: with no
# RIL the real GpsOpen() fails and gpsd aborts (G3b).
PRELOADS=(libomandroid-sitril-gps.so)
# gpsd retries its (absent) sensor service from a new thread after every
# failed lookup, in a tight loop; park those threads (see the shim).
ABSENT_PARK=1

# OMANDROID_GNSS_STAGE: "lhd" starts only lhd; "gpsd" (default) starts the
# engine too. lhd starts the chip on its own at start-up: nstandby 0 then 1
# (sysfs), 20 ms, then it opens /dev/bbd_control and /dev/ttyBCM, auto-bauds
# and downloads the patch (its verbose log, under qemu). gpsd connects to it
# over the named pipes in /data/vendor/gps.
# OMANDROID_GNSS_REQ: gpsd starts a position session only when asked. With
# "1" (default) the runner asks through gpsd's control pipe (gps.xml CtrlPipe,
# /data/vendor/gps/glgpsctrl) for a continuous request, whose NMEA goes to
# the NmeaOutName FIFO: "$pglirm,req_pos,omandroid,period,1000" (the
# command and its stop counterpart are strings in gpsd). "0" leaves gpsd
# idle.
# OMANDROID_GNSS_JOB: name a <job> from gps.xml on gpsd's command line
# instead ("omandroid" is a continuous request added below). Empty
# (default): gpsd runs as a plain daemon.
GNSS_STAGE=${OMANDROID_GNSS_STAGE:-gpsd}
GNSS_REQ=${OMANDROID_GNSS_REQ:-1}
GNSS_JOB=${OMANDROID_GNSS_JOB:-}
GNSS_CTRL=$STATE/data/vendor/gps/glgpsctrl
# OMANDROID_GNSS_LHD_LOG: lhd's LogLevel (tag:level, as in its own
# "SetLogLevel: [*:E]"). Bring-up default: everything ("*:V"). Empty keeps
# stock's (errors only).
GNSS_LHD_LOG=${OMANDROID_GNSS_LHD_LOG-*:V}

gnss_nstandby() {
  local d
  for d in /sys/bus/spi/drivers/bcm4775x-gnss/spi*; do
    [[ -f $d/nstandby ]] && { echo "$d/nstandby"; return; }
  done
}

profile_check() {
  local ok=0 n
  for n in "${GNSS_NODES[@]}"; do
    [[ -c /dev/$n ]] || { say "no /dev/$n (modprobe bcm4775x-gnss, gnss DT overlay)"; ok=1; }
  done
  [[ -n $(gnss_nstandby) ]] || { say "no nstandby attribute (bcm4775x-gnss not bound)"; ok=1; }
  [[ -f $IMAGE/vendor/bin/hw/lhd && -f $IMAGE/vendor/bin/hw/gpsd ]] ||
    { say "no lhd/gpsd in $IMAGE"; ok=1; }
  [[ -f $IMAGE/vendor/firmware/SensorHub.patch ]] || { say "no SensorHub.patch in $IMAGE"; ok=1; }
  return $ok
}

# Stock's configuration with these changes: the nstandby attribute's path in
# the chroot, logs under /data, no PPS (Google's bbd_pps is not ported), and
# no sensor aiding (SensorsMask 0): there is no Android sensor service, and
# with the mask set gpsd retries it in a tight loop (tens of thousands of
# times a minute).
gnss_config() {
  local out=$1
  mkdir -p "$out"
  sed -e 's|^GpioNStdbyPath=.*|GpioNStdbyPath=/sys/omandroid-gnss/nstandby|' \
      -e 's|^LogDirectory=.*|LogDirectory=/data/vendor/gps/log|' \
      -e 's|^PpsEnable=.*|PpsEnable=false|' \
      "$IMAGE/vendor/etc/gnss/lhd.conf" > "$out/lhd.conf"
  if [[ -n $GNSS_LHD_LOG ]]; then
    # With LogEnabled=false lhd drops back to errors after reading its
    # config; logging to logcat (our stderr, through the shim) keeps it.
    sed -i -e '/^LogLevel=/d' -e 's/^LogEnabled=.*/LogEnabled=true/' \
        -e 's/^Log=.*/Log=LOGCAT/' "$out/lhd.conf"
    printf 'LogLevel=%s\n' "$GNSS_LHD_LOG" >> "$out/lhd.conf"
  fi
  sed -e 's|GpioNStdbyPath="[^"]*"|GpioNStdbyPath="/sys/omandroid-gnss/nstandby"|' \
      -e 's|LogDirectory="[^"]*"|LogDirectory="/data/vendor/gps/log/"|' \
      -e 's|PpsEnable="true"|PpsEnable="false"|' \
      -e 's|SensorsMask="[^"]*"|SensorsMask="0x0"|' \
      -e 's|</glgps>|  <job id="omandroid">\n    <task>\n      <req_pos validfix="4294967295" duration_sec="4294967295"/>\n    </task>\n  </job>\n</glgps>|' \
      "$IMAGE/vendor/etc/gnss/gps.xml" > "$out/gps.xml"
  grep -q '<job id="omandroid">' "$out/gps.xml" || die "gps.xml: job not added"
  grep -q 'GpioNStdbyPath=/sys/omandroid-gnss/nstandby' "$out/lhd.conf" ||
    die "lhd.conf: GpioNStdbyPath not rewritten"
  grep -q 'GpioNStdbyPath="/sys/omandroid-gnss/nstandby"' "$out/gps.xml" ||
    die "gps.xml: GpioNStdbyPath not rewritten"
}

profile_setup() {
  local n gps=$STATE/data/vendor/gps
  for n in "${GNSS_NODES[@]}"; do bind "/dev/$n" "$ROOT/dev/$n"; done
  bind "$(gnss_nstandby)" "$ROOT/sys/omandroid-gnss/nstandby"
  mkdir -p "$gps/log"
  [[ -p $gps/nmea_out ]] || { rm -f "$gps/nmea_out"; mkfifo -m 0600 "$gps/nmea_out"; }
  # gpsd's control pipe (gps.xml CtrlPipe): created here, so the request
  # below never depends on whether gpsd makes it itself
  [[ -p $gps/glgpsctrl ]] || { rm -f "$gps/glgpsctrl"; mkfifo -m 0660 "$gps/glgpsctrl"; }
  mkdir -p "$ROOT/omandroid/gnss"
  mount -t tmpfs -o mode=0755,nosuid,nodev,noexec gnss-etc "$ROOT/omandroid/gnss"
  gnss_config "$ROOT/omandroid/gnss"
}

# Ask gpsd for a continuous position request once its control pipe
# exists. Runs detached from the supervisor's job table, so its end does
# not count as "a service exited".
gnss_request() {
  local i
  for ((i = 0; i < 60; i++)); do
    if [[ -p $GNSS_CTRL ]]; then
      sleep 2
      say "control pipe: req_pos"
      # open() of a FIFO blocks until gpsd reads it: bound it
      /usr/bin/timeout 5 /usr/bin/bash -c 'printf "%s\r\n" "$1" > "$2"' _ \
        '$pglirm,req_pos,omandroid,period,1000' "$GNSS_CTRL" ||
        say "control pipe: write failed or timed out"
      return 0
    elif [[ -e $GNSS_CTRL ]]; then
      say "control pipe $GNSS_CTRL is not a FIFO ($(stat -c %F "$GNSS_CTRL")); no request sent"
      return 1
    fi
    sleep 1
  done
  say "no control pipe $GNSS_CTRL after 60 s"
}

profile_start() {
  spawn lhd vendor /vendor/bin/hw/lhd /omandroid/gnss/lhd.conf
  [[ $GNSS_STAGE == lhd ]] && return
  sleep 2
  if [[ -n $GNSS_JOB ]]; then
    spawn gpsd vendor /vendor/bin/hw/gpsd -c /omandroid/gnss/gps.xml "$GNSS_JOB"
  else
    spawn gpsd vendor /vendor/bin/hw/gpsd -c /omandroid/gnss/gps.xml
  fi
  if [[ $GNSS_REQ == 1 ]]; then
    gnss_request &
    disown $!
  fi
}
