# SPDX-License-Identifier: MIT
# Vendor-chroot profile "gnss": Broadcom's lhd (patch loader and chip link)
# and gpsd (the position engine) from the stock vendor image, driving the
# BCM4775x through the bcm4775x-gnss kernel driver (/dev/ttyBCM, /dev/bbd_*).
# device/cheetah/GNSS-PLAN.md.
#
# Output: NMEA on the FIFO /data/vendor/gps/nmea_out (gps.xml NmeaOutName),
# that is $STATE/data/vendor/gps/nmea_out on the host, which
# omandroid-gnss-nmea serves to GeoClue and gpsd.
# shellcheck shell=bash disable=SC2034

STATE=/var/lib/omandroid-vendor/gnss
# gpsd links libbinder_ndk (sensor fusion, wake locks): a private binderfs
# and servicemanager, with the sensor and suspend services reported absent
# by the shim at once.
BINDER=yes
NO_SERVICES="android.hardware.sensors.,android.hardware.gnss.,vendor.samsung_slsi.telephony."

GNSS_NODES=(ttyBCM bbd_control bbd_patch bbd_pwrstat bbd_sensor)
BINS=(/vendor/bin/hw/lhd /vendor/bin/hw/gpsd)

# OMANDROID_GNSS_STAGE: "lhd" starts only lhd (chip link and patch, stage
# G3); "gpsd" (default) starts the engine too.
# OMANDROID_GNSS_JOB: Broadcom's gpsd runs a <job> from gps.xml when one is
# named on its command line, without any HAL client. "omandroid" (default)
# is a continuous position request added below; empty runs gpsd as a plain
# daemon that waits for a HAL (open question 4 in GNSS-PLAN.md).
GNSS_STAGE=${OMANDROID_GNSS_STAGE:-gpsd}
GNSS_JOB=${OMANDROID_GNSS_JOB-omandroid}

gnss_nstandby() {
  local d
  for d in /sys/bus/spi/drivers/bcm4775x-gnss/spi*; do
    [[ -f $d/nstandby ]] && { echo "$d/nstandby"; return; }
  done
}

profile_check() {
  local ok=0 n
  for n in "${GNSS_NODES[@]}"; do
    [[ -c /dev/$n ]] || { say "no /dev/$n (modprobe bcm4775x-gnss, gnss DT overlay)"; ok=1; }
  done
  [[ -n $(gnss_nstandby) ]] || { say "no nstandby attribute (bcm4775x-gnss not bound)"; ok=1; }
  [[ -f $IMAGE/vendor/bin/hw/lhd && -f $IMAGE/vendor/bin/hw/gpsd ]] ||
    { say "no lhd/gpsd in $IMAGE"; ok=1; }
  [[ -f $IMAGE/vendor/firmware/SensorHub.patch ]] || { say "no SensorHub.patch in $IMAGE"; ok=1; }
  return $ok
}

# Stock's configuration with three changes: the nstandby attribute's path in
# the chroot, logs under /data, and no PPS (Google's bbd_pps is not ported).
gnss_config() {
  local out=$1
  mkdir -p "$out"
  sed -e 's|^GpioNStdbyPath=.*|GpioNStdbyPath=/sys/omandroid-gnss/nstandby|' \
      -e 's|^LogDirectory=.*|LogDirectory=/data/vendor/gps/log|' \
      -e 's|^PpsEnable=.*|PpsEnable=false|' \
      "$IMAGE/vendor/etc/gnss/lhd.conf" > "$out/lhd.conf"
  sed -e 's|GpioNStdbyPath="[^"]*"|GpioNStdbyPath="/sys/omandroid-gnss/nstandby"|' \
      -e 's|LogDirectory="[^"]*"|LogDirectory="/data/vendor/gps/log/"|' \
      -e 's|PpsEnable="true"|PpsEnable="false"|' \
      -e 's|</glgps>|  <job id="omandroid">\n    <task>\n      <req_pos validfix="4294967295" duration_sec="4294967295"/>\n    </task>\n  </job>\n</glgps>|' \
      "$IMAGE/vendor/etc/gnss/gps.xml" > "$out/gps.xml"
  grep -q '<job id="omandroid">' "$out/gps.xml" || die "gps.xml: job not added"
  grep -q 'GpioNStdbyPath=/sys/omandroid-gnss/nstandby' "$out/lhd.conf" ||
    die "lhd.conf: GpioNStdbyPath not rewritten"
  grep -q 'GpioNStdbyPath="/sys/omandroid-gnss/nstandby"' "$out/gps.xml" ||
    die "gps.xml: GpioNStdbyPath not rewritten"
}

profile_setup() {
  local n gps=$STATE/data/vendor/gps
  for n in "${GNSS_NODES[@]}"; do bind "/dev/$n" "$ROOT/dev/$n"; done
  bind "$(gnss_nstandby)" "$ROOT/sys/omandroid-gnss/nstandby"
  mkdir -p "$gps/log"
  [[ -p $gps/nmea_out ]] || { rm -f "$gps/nmea_out"; mkfifo -m 0600 "$gps/nmea_out"; }
  mkdir -p "$ROOT/omandroid/gnss"
  mount -t tmpfs -o mode=0755,nosuid,nodev,noexec gnss-etc "$ROOT/omandroid/gnss"
  gnss_config "$ROOT/omandroid/gnss"
}

profile_start() {
  spawn lhd vendor /vendor/bin/hw/lhd /omandroid/gnss/lhd.conf
  [[ $GNSS_STAGE == lhd ]] && return
  # lhd takes the chip out of standby and loads the patch (about a second
  # on stock) before gpsd talks to it.
  sleep 3
  if [[ -n $GNSS_JOB ]]; then
    spawn gpsd vendor /vendor/bin/hw/gpsd -c /omandroid/gnss/gps.xml "$GNSS_JOB"
  else
    spawn gpsd vendor /vendor/bin/hw/gpsd -c /omandroid/gnss/gps.xml
  fi
}
